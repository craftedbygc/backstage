<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backstage Lite — Three.js</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        max-width: 360px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hint">
      Backstage Lite + Three.js — studio-lite, core-lite, and
      <code>@unseenco/backstage/threejs</code> extension. Edit the cube transform
      in Studio; orbit with the extension toolbar.
    </div>
    <script src="./index.tsx" type="module"></script>
  </body>
</html>

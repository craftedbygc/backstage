# Unified static site: VitePress API docs at /docs/ and playground MPA at /playground/.
# Each PR gets a Netlify Deploy Preview; merges to main update production.
#
# Netlify UI (Site configuration → Build & deploy → Build settings):
#   • Base directory: leave blank (repository root)
#   • Build command / Publish directory: leave blank — this file sets them
#
# Do not use docs/netlify.toml; a single site is configured here.

[build]
  command = "corepack enable && yarn install --immutable && yarn build:site"
  publish = "deploy"
  # Diff the full repo (no path filter). Do not append " .." — git treats that as revision
  # range syntax and can make PRs look unchanged.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"

# Deploy previews must always build: PRs need a preview URL even when the ignore diff above
# would skip (e.g. CACHED_COMMIT_REF equals COMMIT_REF on a re-run).
[context.deploy-preview]
  ignore = "false"

[build.environment]
  NODE_VERSION = "22"

# Studio publish tarball can exceed Verdaccio's default 10mb limit (source maps).
max_body_size: 100mb

store:
  memory:
    limit: 10000
# Studio + extension tarballs can exceed Verdaccio's default body limit during compat publish.
max_body_size: 100mb
auth:
  auth-memory:
    users:
      test:
        name: test
        password: test
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: false
packages:
  '@unseenco/theatre-*':
    access: $all
    publish: $all
  '@*/*':
    access: $all
    publish: $all
    proxy: npmjs
  '**':
    access: $all
    proxy: npmjs
logs:
  type: stdout
  format: pretty
  level: error
